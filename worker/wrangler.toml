# Cloudflare Worker for the Website Health & Security Checker. Setup steps: worker/README.md
name = "site-checker"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# The API lives at https://api.sanaullahniazi.com (the domain is on Cloudflare, so the DNS record is created for you).
routes = [{ pattern = "api.sanaullahniazi.com", custom_domain = true }]

# Keep the Worker's logs (errors and console output) in the Cloudflare dashboard: Workers > site-checker > Logs.
[observability]
enabled = true

# Delete expired reports and rate-limit counters once a day.
[triggers]
crons = ["17 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "site-checker"
# The deploy workflow (.github/workflows/deploy-worker.yml) creates the database and fills this in.
# To deploy by hand instead, paste the id that `npx wrangler d1 create site-checker` prints.
database_id = "set-by-the-deploy-workflow"

# Workers AI runs the prompt injection lab's demo bot (/tools/prompt-injection-lab/). Free: 10,000 "neurons" a day,
# roughly 900 attacks with the model below. Remove these two lines to turn the lab's live bot off.
[ai]
binding = "AI"

[vars]
# Pages allowed to call this API.
ALLOWED_ORIGINS = "https://sanaullahniazi.com,https://www.sanaullahniazi.com,http://localhost:4000,http://127.0.0.1:4000"
# Scans per visitor per hour, and fresh scans per day for everyone (keeps you inside the free API limits).
SCANS_PER_HOUR = "5"
SCANS_PER_DAY = "300"
# Reuse a scan of the same address for this many hours instead of scanning again.
CACHE_HOURS = "1"
# Delete reports (and the scanned address) after this many days.
REPORT_DAYS = "7"
# Prompt injection lab: the model, attacks per lab session (one CAPTCHA, valid an hour), sessions per visitor per hour,
# and attacks that reach the model per day for everyone.
LAB_MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8"
LAB_RUNS = "100"
LAB_SESSIONS_PER_HOUR = "3"
LAB_RUNS_PER_DAY = "700"
# YouTube creator tools (/tools/youtube/): lookups per visitor per hour, and for everyone per day. Every lookup costs
# 1 to 4 of the YouTube Data API's 10,000 free daily units; answers are cached for hours, so repeats are free.
# YT_TRANSCRIPTS = "off" turns the transcript extractor off (it uses the caption track the YouTube player loads).
YT_PER_HOUR = "60"
YT_PER_DAY = "3000"
YT_TRANSCRIPTS = "on"

# Secrets, set with `npx wrangler secret put NAME` (never commit them):
#   PSI_KEY           Google PageSpeed Insights API key
#   TURNSTILE_SECRET  Cloudflare Turnstile secret key
#   SSL_LABS_EMAIL    (optional) the email you registered with SSL Labs; leave unset to turn SSL Labs off
#   HASH_SALT         (optional) any long random text, used to hash IP addresses for the rate limit
#   YT_KEY            YouTube Data API v3 key, for the YouTube tools (thumbnails work without it)
