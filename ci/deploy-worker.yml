# Deploys the backend of the Website Health & Security Checker (worker/) to Cloudflare Workers.
# Runs when worker/ changes on main, or by hand from the Actions tab ("Deploy website checker" > "Run workflow").
# It needs these repository secrets (Settings > Secrets and variables > Actions); setup steps in worker/README.md:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  to deploy
#   PSI_KEY, TURNSTILE_SECRET                    for the checker itself
#   SSL_LABS_EMAIL, HASH_SALT                    optional
#   YT_KEY                                       YouTube Data API key, for the YouTube tools
name: Deploy website checker

on:
  push:
    branches: [main]
    paths: ["worker/**", "_data/pil_rules.json", "_data/pil_attacks.yml", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    # The Cloudflare token is given only to the steps that talk to Cloudflare, not to npm ci or the tests, which run
    # the installed packages' code.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check the secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets first (see worker/README.md)."
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - name: Create the database (first time only) and fill in its id
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          id=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8"));const d=l.find(x=>x.name==="site-checker");process.stdout.write(d?d.uuid:"")')
          if [ -z "$id" ]; then
            npx wrangler d1 create site-checker
            id=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8"));process.stdout.write(l.find(x=>x.name==="site-checker").uuid)')
          fi
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: Create or update the tables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute site-checker --remote --file=schema.sql --yes
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Upload the secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PSI_KEY: ${{ secrets.PSI_KEY }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          SSL_LABS_EMAIL: ${{ secrets.SSL_LABS_EMAIL }}
          HASH_SALT: ${{ secrets.HASH_SALT }}
          YT_KEY: ${{ secrets.YT_KEY }}
        run: |
          node -e 'const o={};for(const k of ["PSI_KEY","TURNSTILE_SECRET","SSL_LABS_EMAIL","HASH_SALT","YT_KEY"])if(process.env[k])o[k]=process.env[k];require("fs").writeFileSync("/tmp/secrets.json",JSON.stringify(o))'
          if [ "$(cat /tmp/secrets.json)" != "{}" ]; then npx wrangler secret bulk /tmp/secrets.json; fi
          rm -f /tmp/secrets.json
      - name: Check it answers
        run: |
          sleep 10
          curl -fsS https://api.sanaullahniazi.com/ || echo "::warning::api.sanaullahniazi.com isn't answering yet. A new custom domain can take a few minutes."
